<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DECOLE | Treinamento Profissional</title>

    <!-- Ícones -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(145deg, #07152f, #0b2a55, #0a4770);
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        /* LOGO */
        .logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            background: #ffffff;
            border-radius: 50%;
            padding: 10px;
            margin: 0 auto 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,.25);
        }

        /* NOME */
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: .5px;
        }

        .verified {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #1688ff;
            width: 19px;
            height: 19px;
            border-radius: 50%;
            font-size: 11px;
            margin-left: 4px;
        }

        .subtitle {
            font-size: 15px;
            line-height: 1.5;
            opacity: .9;
            margin-bottom: 25px;
        }

        /* BOTÕES */
        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 58px;
            padding: 14px 55px 14px 55px;

            border-radius: 16px;

            text-decoration: none;
            color: #ffffff;

            font-size: 16px;
            font-weight: 700;

            background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.25);

            backdrop-filter: blur(10px);

            transition: .25s ease;

            box-shadow: 0 8px 25px rgba(0,0,0,.15);
        }

        .link:hover {
            transform: translateY(-3px) scale(1.01);
            background: rgba(255,255,255,.20);
        }

        .link i {
            position: absolute;
            left: 20px;
            font-size: 22px;
        }

        /* BOTÃO PRINCIPAL */
        .matricula {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            box-shadow: 0 10px 30px rgba(0,114,255,.35);
        }

        .matricula:hover {
            background: linear-gradient(135deg, #16d5ff, #1685ff);
        }

        /* WHATSAPP */
        .whatsapp {
            background: linear-gradient(135deg, #16c784, #0aa968);
            border: none;
        }

        .whatsapp:hover {
            background: linear-gradient(135deg, #20d993, #0cba75);
        }

        /* REDES SOCIAIS */
        .social {
            background: rgba(255,255,255,.09);
        }

        /* RODAPÉ */
        .footer {
            margin-top: 30px;
            font-size: 12px;
            opacity: .65;
            line-height: 1.5;
        }

        .footer strong {
            opacity: 1;
        }

        /* RESPONSIVO */
        @media (max-width: 400px) {

            body {
                padding-top: 20px;
            }

            .logo {
                width: 105px;
                height: 105px;
            }

            h1 {
                font-size: 24px;
            }

            .link {
                min-height: 55px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- =========================
             LOGO
             Troque pelo caminho da sua logo
        ========================== -->

        <img
            class="logo"
            src="logo-decole.png"
            alt="DECOLE Treinamento Profissional"
        >

        <h1>
            DECOLE
            <span class="verified">
                <i class="fa-solid fa-check"></i>
            </span>
        </h1>

        <p class="subtitle">
            Treinamento Profissional<br>
            Prepare-se hoje para conquistar novas oportunidades.
        </p>


        <div class="links">

            <!-- MATRÍCULA -->
            <a
                class="link matricula"
                href="COLE_AQUI_O_LINK_DA_MATRICULA"
                target="_blank"
            >
                <i class="fa-solid fa-graduation-cap"></i>
                Faça sua matrícula
            </a>


            <!-- WHATSAPP -->
            <a
                class="link whatsapp"
                href="COLE_AQUI_O_LINK_DO_WHATSAPP"
                target="_blank"
            >
                <i class="fa-brands fa-whatsapp"></i>
                Fale conosco pelo WhatsApp
            </a>


            <!-- INSTAGRAM -->
            <a
                class="link social"
                href="COLE_AQUI_O_LINK_DO_INSTAGRAM"
                target="_blank"
            >
                <i class="fa-brands fa-instagram"></i>
                Siga a DECOLE no Instagram
            </a>


            <!-- LINKEDIN -->
            <a
                class="link social"
                href="COLE_AQUI_O_LINK_DO_LINKEDIN"
                target="_blank"
            >
                <i class="fa-brands fa-linkedin-in"></i>
                Acompanhe a DECOLE no LinkedIn
            </a>


            <!-- FACEBOOK -->
            <a
                class="link social"
                href="COLE_AQUI_O_LINK_DO_FACEBOOK"
                target="_blank"
            >
                <i class="fa-brands fa-facebook-f"></i>
                Siga a DECOLE no Facebook
            </a>

        </div>


        <div class="footer">
            <strong>DECOLE Treinamento Profissional</strong><br>
            Conhecimento que transforma oportunidades.
        </div>

    </main>

</body>
</html>
